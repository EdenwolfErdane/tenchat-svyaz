<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ключевой визуал</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<div class="slide" style="padding: 0; background: #0A1628;">
  <div class="brand-mark" style="z-index: 10;">TenChat<span class="dot">.</span> Campaign</div>

  <!-- Full background image -->
  <img src="../02-creative/assets/key_visual_network.png" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.85;">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 22, 40, 0.4) 0%, rgba(10, 22, 40, 0.95) 80%);"></div>

  <div style="position: relative; z-index: 5; padding: 80px 64px; height: 100%; display: flex; flex-direction: column;">
    <div class="section-label">07 — Ключевой визуал</div>

    <div style="margin-top: auto; max-width: 920px;">
      <h1 class="h-1" style="font-size: 64px; margin-bottom: 24px;">
        Один узел —<br>
        <span style="color: var(--signal);">целая сеть.</span>
      </h1>

      <p class="body-text body-muted" style="font-size: 20px; margin-bottom: 32px; max-width: 720px;">
        Центральная метафора кампании: одно первое сообщение — это светящаяся точка. От неё расходятся линии к другим узлам. Граф растёт. Всё началось с одной точки.
      </p>

      <div style="display: flex; gap: 32px;">
        <div>
          <div style="width: 24px; height: 24px; background: var(--signal); border-radius: 50%; box-shadow: 0 0 20px var(--signal); margin-bottom: 8px;"></div>
          <div style="font-family: var(--font-heading); font-weight: 700; font-size: 14px;">Сигнал</div>
          <div style="font-size: 12px; color: var(--text-muted);">первый контакт</div>
        </div>
        <div>
          <div style="width: 24px; height: 24px; background: var(--meeting); border-radius: 50%; box-shadow: 0 0 20px var(--meeting); margin-bottom: 8px;"></div>
          <div style="font-family: var(--font-heading); font-weight: 700; font-size: 14px;">Встреча</div>
          <div style="font-size: 12px; color: var(--text-muted);">возможность</div>
        </div>
        <div>
          <div style="width: 24px; height: 24px; background: var(--success); border-radius: 50%; box-shadow: 0 0 20px var(--success); margin-bottom: 8px;"></div>
          <div style="font-family: var(--font-heading); font-weight: 700; font-size: 14px;">Результат</div>
          <div style="font-size: 12px; color: var(--text-muted);">дело</div>
        </div>
      </div>
    </div>

    <div style="position: absolute; bottom: 32px; right: 64px; font-family: var(--font-num); font-size: 12px; color: var(--text-muted);">07 / 14</div>
  </div>
</div>
</body>
</html>

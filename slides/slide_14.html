<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Финал</title>
<link rel="stylesheet" href="global.css">
</head>
<body>
<div class="slide" style="padding: 0; background: linear-gradient(135deg, #0A1628 0%, #142235 50%, #1E2F47 100%);">
  <div class="brand-mark" style="z-index: 10;">TenChat<span class="dot">.</span> Campaign</div>

  <!-- Background network graph -->
  <img src="../02-creative/assets/key_visual_network.png" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 900px; height: 900px; object-fit: contain; opacity: 0.2; filter: blur(1px);">

  <div style="position: relative; z-index: 5; padding: 80px 64px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
    <div class="section-label" style="text-align: center;">14 — Один контакт</div>

    <h1 class="h-display" style="font-size: 96px; margin-bottom: 24px; line-height: 1;">
      Один контакт<br>
      может изменить<br>
      <span style="color: var(--signal);">всё.</span>
    </h1>

    <p class="body-text body-muted" style="font-size: 22px; margin-bottom: 48px; max-width: 720px;">
      TenChat. Связь, которая становится делом.
    </p>

    <div style="background: var(--signal); color: var(--bg); font-family: var(--font-heading); font-weight: 700; font-size: 18px; padding: 18px 36px; border-radius: 12px; box-shadow: 0 0 40px rgba(0, 212, 255, 0.4); margin-bottom: 48px;">
      Найди свою связь → tenchat.ru/svyaz
    </div>

    <div style="font-size: 13px; color: var(--text-muted); max-width: 600px; line-height: 1.6;">
      Концепция разработана для участия в креативном конкурсе TenChat.<br>
      Все визуалы сгенерированы ИИ. Все истории — собирательный образ.
    </div>

    <div style="position: absolute; bottom: 32px; right: 64px; font-family: var(--font-num); font-size: 12px; color: var(--text-muted);">14 / 14</div>
    <div style="position: absolute; bottom: 32px; left: 64px; font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: var(--text-muted); letter-spacing: 0.1em;">
      СВЯЗЬ<span style="color: var(--signal);">.</span>
    </div>
  </div>
</div>
</body>
</html>
